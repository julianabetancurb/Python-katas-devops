name: CI and Deploy

on:
  push:
    branches: ["main", "dev"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest
      - run: ruff check .
      - name: Smoke test API
        run: |
          uvicorn api:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl --fail http://127.0.0.1:8000/openapi.json

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias para Linux
        run: |
          pip install -r requirements.txt --target ./package --upgrade
          find ./package -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - name: Construir ZIP
        run: |
          cd package && zip -r ../deployment.zip . -x "*.pyc"
          cd ..
          zip -r deployment.zip api.py src/ -x "*.pyc" -x "*/__pycache__/*"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Subir a Lambda
        run: |
          aws lambda update-function-code \
            --function-name python-katas-lambda \
            --zip-file fileb://deployment.zip \
            --region us-east-2
      - name: Verificar deploy
        run: |
          aws lambda wait function-updated \
            --function-name python-katas-lambda \
            --region us-east-2